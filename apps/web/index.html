<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#D9141E" />
    <link rel="icon" type="image/png" href="/assets/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
    <title>ZPROO GO — Travel Smarter. Go Further.</title>
    <meta
      name="description"
      content="Flights, Buses, Trains, Hotels, Cabs, Bikes, Holidays & Parcels — all in one app."
    />
    <style>
      /* Boot splash shown until React mounts; replaced by the app on first render. */
      .zp-boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
        justify-content: center;
        background: #fff;
      }
      .zp-boot img {
        height: 48px;
        width: auto;
      }
      .zp-boot span {
        width: 28px;
        height: 28px;
        border-radius: 9999px;
        border: 3px solid #fdecec;
        border-top-color: #d9141e;
        animation: zp-spin 0.8s linear infinite;
      }
      @keyframes zp-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .zp-boot span {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="zp-boot" role="status" aria-label="Loading ZPROO GO">
        <img src="/assets/brand/zproo-go-logo.png" alt="ZPROO GO" width="302" height="77" />
        <span aria-hidden="true"></span>
      </div>
    </div>
    <noscript>ZPROO GO needs JavaScript enabled to work.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
