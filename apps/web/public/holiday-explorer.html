<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zproo Holidays Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Concept: immersive poster cards, featured hero, top filter bar with popovers, one long details page with scroll-spy, slide-over booking drawer. */
:root{
  --bg:#FBF8F8; --surface:#FFFFFF; --surface-2:#F5EFEF; --ink:#1B1517; --ink-2:#554B4E; --ink-3:#8C8185;
  --line:#EDE5E6; --accent:#E11D2E; --accent-d:#B91424; --accent-ink:#FFFFFF; --accent-soft:#FFF0F1; --accent-line:#FFD3D8;
  --good:#12A150; --good-soft:#E6F7EE; --warn:#C77700; --shadow:0 18px 40px -24px rgba(60,10,20,.4);
  --nav:rgba(255,255,255,.88); --dim:rgba(20,10,14,.55); --sk-a:#EFE8E9; --sk-b:#F8F3F4; --glass:rgba(255,255,255,.16);
  --font:'Poppins','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-line);outline-offset:2px;border-radius:10px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px}
.muted{color:var(--ink-2)}
h1,h2,h3{margin:0;letter-spacing:-.025em;text-wrap:balance}
h2{font-size:clamp(22px,2.6vw,30px);font-weight:800}
.ico{width:18px;height:18px;flex:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--nav);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;color:var(--accent);letter-spacing:-.03em;background:none;border:0;padding:0}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--accent);position:relative;display:block}
.logo i:after{content:'';position:absolute;left:8px;top:8px;width:14px;height:14px;border-radius:50%;border:3px solid #fff;border-right-color:transparent;transform:rotate(30deg)}
.logo b{color:var(--ink)}
.tabs{display:flex;gap:4px}
.tab{display:flex;gap:7px;align-items:center;padding:9px 15px;border-radius:12px;color:var(--ink-2);font-weight:500;font-size:13.5px}
.tab.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.hr{display:flex;gap:10px;align-items:center}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
@media (max-width:820px){.tabs .tab:not(.on){display:none}}

/* buttons / chips / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 22px;font-weight:600;font-size:14px;border:1.5px solid transparent;transition:transform .12s,background .12s,box-shadow .12s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.red{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:var(--accent-ink);box-shadow:0 12px 22px -12px var(--accent)}
.btn.red:hover{filter:brightness(1.06)}
.btn.line{background:var(--surface);border-color:var(--accent);color:var(--accent)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.white{background:#fff;color:#1B1517}
.btn.sm{padding:9px 16px;font-size:13px;border-radius:12px}
.btn.lg{padding:15px 26px;font-size:15px;border-radius:16px}
.btn.block{width:100%}
.btn[disabled]{opacity:.6;cursor:progress}
.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
button.chip:hover{border-color:var(--accent-line)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.soft{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--ink-2)}
.in{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;outline:none;transition:border .12s,box-shadow .12s;min-width:0}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.in.err{border-color:var(--accent)}
.err-t{color:var(--accent);font-size:12px;font-weight:500}
.iw{position:relative;display:flex;align-items:center}
.iw .ico{position:absolute;left:14px;color:var(--accent);pointer-events:none}
.iw .in{padding-left:42px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.sec{padding:26px}
@media (max-width:560px){.sec{padding:18px}}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:0}

/* featured hero */
.hero{position:relative;color:#fff;min-height:540px;display:flex;align-items:flex-end;overflow:hidden;background:#2a1418}
.hero .bg{position:absolute;inset:0;animation:fade .7s ease}
.hero .bg>*{width:100%;height:100%}
.hero .bg svg,.hero .bg img{width:100%;height:100%;object-fit:cover}
.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,8,12,.35) 0%,rgba(20,8,12,.05) 35%,rgba(20,8,12,.78) 100%),linear-gradient(90deg,rgba(120,10,20,.55),transparent 60%)}
@keyframes fade{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.hero .wrap{position:relative;z-index:2;width:100%;padding-block:46px 120px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.dh .wrap>.kicker{margin-top:60px}
.kicker{display:inline-flex;gap:8px;align-items:center;background:var(--glass);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(8px);padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600}
.hero h1{font-size:clamp(32px,5.4vw,60px);font-weight:800;line-height:1.05;margin-top:16px;max-width:680px;text-shadow:0 4px 24px rgba(0,0,0,.35)}
.hero .m{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;align-items:center;font-weight:500}
.hero .m span{display:inline-flex;gap:6px;align-items:center}
.hero .cta{display:flex;gap:14px;align-items:center;margin-top:22px;flex-wrap:wrap}
.hero .pr small{display:block;opacity:.8;font-size:11.5px}
.hero .pr b{font-size:28px;font-weight:800;letter-spacing:-.03em}
.feats{display:flex;gap:10px}
.feat{width:92px;height:72px;border-radius:16px;overflow:hidden;border:2px solid transparent;padding:0;background:none;opacity:.8;transition:all .2s}
.feat.on{border-color:#fff;opacity:1;transform:translateY(-4px)}
.feat>*{width:100%;height:100%}
.feat svg,.feat img{width:100%;height:100%;object-fit:cover}
@media (max-width:760px){.feats{display:none}.hero{min-height:480px}}
@media (prefers-reduced-motion:reduce){.hero .bg{animation:none}}

/* finder */
.finder{margin-top:-84px;position:relative;z-index:5;padding:16px;border-radius:28px}
.frow{display:grid;grid-template-columns:1fr auto;gap:12px}
@media (max-width:560px){.frow{grid-template-columns:1fr}.frow .btn{width:100%}}
.big{padding:16px 16px 16px 46px;border-radius:18px;font-size:15px}
.iw.lg .ico{left:16px;width:20px;height:20px}
.fchips{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.pw{position:relative}
.pop{position:absolute;top:calc(100% + 10px);left:0;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);padding:18px;width:300px;max-width:calc(100vw - 40px)}
.pop h4{margin:0 0 12px;font-size:14px}
.chip .n{background:var(--accent);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700}
.chip.on .n{background:#fff;color:var(--accent)}
@media (max-width:640px){.pop{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-width:none;border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));z-index:60}.pdim{position:fixed;inset:0;background:var(--dim);z-index:59}}
input[type=range]{width:100%;accent-color:var(--accent)}
.rv{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-3);margin-top:4px}
.chk{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;cursor:pointer;position:relative}
.chk input{position:absolute;opacity:0;pointer-events:none}
.cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--ink-3);display:grid;place-items:center;flex:none;color:#fff}
.chk input:checked+.cb{background:var(--accent);border-color:var(--accent)}
.chk input:focus-visible+.cb{outline:3px solid var(--accent-line);outline-offset:2px}
.chk small{margin-left:auto;color:var(--ink-3)}

/* stories */
.stories{display:flex;gap:18px;overflow-x:auto;padding:6px 4px 14px;margin-top:26px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0;font-weight:600;font-size:12.5px;color:var(--ink-2)}
.story .ring{width:76px;height:76px;border-radius:50%;padding:3px;background:conic-gradient(var(--accent),#ff8a96,var(--accent));transition:transform .15s}
.story:hover .ring{transform:scale(1.05)}
.story.on .ring{box-shadow:0 0 0 4px var(--accent-soft)}
.story .ring>div{width:100%;height:100%;border-radius:50%;overflow:hidden;border:3px solid var(--bg)}
.story .ring>div>*{width:100%;height:100%}
.story svg,.story img{width:100%;height:100%;object-fit:cover}
.story.on{color:var(--accent)}

/* results + poster cards */
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:26px 0 18px}
.rhead .t{font-size:22px;font-weight:800;letter-spacing:-.02em}
.active{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sel{width:auto;padding:10px 14px;font-size:13px;border-radius:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.poster{position:relative;aspect-ratio:4/5;border-radius:28px;overflow:hidden;isolation:isolate;color:#fff;background:var(--surface-2);box-shadow:var(--shadow);transition:transform .25s}
.poster:hover{transform:translateY(-5px)}
.poster .im{position:absolute;inset:0;z-index:-2;transition:transform .7s}
.poster .im>*{width:100%;height:100%}
.poster .im svg,.poster .im img{width:100%;height:100%;object-fit:cover}
.poster:hover .im{transform:scale(1.07)}
.poster:before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(20,8,12,.35) 0%,rgba(20,8,12,0) 28%,rgba(20,8,12,.2) 48%,rgba(20,8,12,.88) 100%)}
.poster .tp{position:absolute;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;align-items:center}
.tagb{background:var(--accent);padding:5px 12px;border-radius:999px;font-size:11px;font-weight:700}
.heart{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;color:#fff}
.heart.on{background:#fff;color:var(--accent)}
.heart.on svg{fill:var(--accent)}
.poster .bt{position:absolute;left:18px;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px}
.poster .dest{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:600;opacity:.95}
.poster h3{font-size:21px;font-weight:700;line-height:1.2;text-shadow:0 2px 14px rgba(0,0,0,.4)}
.poster .pm{display:flex;gap:10px;font-size:12.5px;align-items:center;flex-wrap:wrap}
.poster .pm span{display:inline-flex;gap:5px;align-items:center;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);padding:4px 10px;border-radius:999px}
.poster .pb{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.25);margin-top:4px}
.poster .pb small{display:block;font-size:10.5px;opacity:.8}
.poster .pb s{font-size:11.5px;opacity:.7}
.poster .pb b{font-size:21px;font-weight:800;letter-spacing:-.03em;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.sk{background:linear-gradient(90deg,var(--sk-a) 25%,var(--sk-b) 37%,var(--sk-a) 63%);background-size:400% 100%;animation:sh 1.3s infinite;border-radius:28px;aspect-ratio:4/5}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}.poster,.poster .im{transition:none}}
.state{padding:56px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.state p{max-width:430px;margin:0;color:var(--ink-2)}
.state .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.code{font-size:12px;color:var(--ink-3);background:var(--surface-2);padding:7px 14px;border-radius:10px}
.suggest{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:12px;font-size:12.5px;color:var(--ink-2)}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;padding:26px 30px;margin-top:44px}
.perk{display:flex;gap:12px;align-items:center;font-weight:600}
.perk span{width:48px;height:48px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}

/* details hero */
.dh{position:relative;color:#fff;min-height:min(560px,78vh);display:flex;align-items:flex-end;overflow:hidden;background:#2a1418}
.dh .bg{position:absolute;inset:0;transition:transform .8s}
.dh .bg>*{width:100%;height:100%}
.dh .bg svg,.dh .bg img{width:100%;height:100%;object-fit:cover}
.dh:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,8,12,.55),rgba(20,8,12,.05) 36%,rgba(20,8,12,.82))}
.dh .wrap{position:relative;z-index:2;width:100%;padding-block:24px 112px}
.crumb{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;align-items:center;opacity:.92;margin-bottom:60px}
.crumb button{background:none;border:0;padding:0;color:inherit}
.crumb b{font-weight:600}
.dh h1{font-size:clamp(30px,5vw,54px);font-weight:800;line-height:1.08;max-width:760px;text-shadow:0 4px 24px rgba(0,0,0,.4);margin-top:14px}
.dh .m{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;align-items:center;font-weight:500}
.dh .m span{display:inline-flex;gap:6px;align-items:center}
.shots{position:absolute;right:20px;bottom:112px;z-index:3;display:flex;gap:8px}
.shot{width:70px;height:54px;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.4);padding:0;background:none}
.shot.on{border-color:#fff}
.shot>*{width:100%;height:100%}
.shot svg,.shot img{width:100%;height:100%;object-fit:cover}
@media (max-width:760px){.shots{display:none}}
.dact{position:absolute;right:20px;top:24px;z-index:3;display:flex;gap:8px}
.gl{background:var(--glass);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(8px);color:#fff}
.facts{margin-top:-64px;position:relative;z-index:5;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;padding:8px;border-radius:26px}
.fact{padding:16px 18px;display:flex;gap:12px;align-items:center;border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact .ic{width:42px;height:42px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.fact small{display:block;color:var(--ink-3);font-size:11.5px}
.fact b{font-size:13.5px;display:block;line-height:1.3}
@media (max-width:700px){.fact{border-right:0}}
.snav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin-top:20px}
.snav .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.snav button{border:0;background:none;padding:10px 18px;border-radius:999px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.snav button.on{background:var(--accent);color:var(--accent-ink)}
.dg{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;margin-top:28px;align-items:start}
@media (max-width:1020px){.dg{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:22px}
.dsec{scroll-margin-top:84px}
.hl{display:flex;gap:12px;padding:8px 0}
.hl .ico{color:var(--accent);margin-top:2px}
.days{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.day{border:1.5px solid var(--line);border-radius:20px;background:var(--surface);overflow:hidden;transition:border .15s}
.day.open{border-color:var(--accent-line);background:var(--surface)}
.day>button{width:100%;display:flex;gap:14px;align-items:center;background:none;border:0;padding:16px 18px;text-align:left}
.day .dn{width:46px;height:46px;border-radius:15px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none;line-height:1.1;text-align:center;font-size:17px}
.day .dn small{display:block;font-size:9px;letter-spacing:.1em;font-weight:700}
.day.open .dn{background:var(--accent);color:#fff}
.day h4{margin:0;font-size:15.5px}
.day .chev{margin-left:auto;transition:transform .2s;color:var(--ink-3)}
.day.open .chev{transform:rotate(180deg)}
.day .dc{padding:0 18px 18px 78px;color:var(--ink-2);line-height:1.75}
@media (max-width:560px){.day .dc{padding-left:18px}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.li{display:flex;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-weight:500}
.li:last-child{border-bottom:0}
.li span{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.li.g span{background:var(--good-soft);color:var(--good)}
.li.r span{background:var(--accent-soft);color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:13.5px;font-variant-numeric:tabular-nums}
.kv.t{font-size:16px;font-weight:700;border-top:1px dashed var(--line);margin-top:6px;padding-top:12px}
.kv.t b:last-child{color:var(--accent)}
.rate{display:inline-flex;gap:4px;align-items:center;background:var(--good-soft);color:var(--good);font-weight:700;font-size:12px;padding:3px 9px;border-radius:8px}
.rev{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:16px}
.rev .card{padding:18px;box-shadow:none;border-radius:20px}
.av{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;flex:none}
.bk{position:sticky;top:calc(84px + env(safe-area-inset-top,0px));padding:24px;border-radius:28px}
@media (max-width:1020px){.bk{position:static}}
.save{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:10px}
.price{font-size:34px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.old{font-size:13px;color:var(--ink-3);text-decoration:line-through}
.dates{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dchip{min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 10px;text-align:center;line-height:1.25}
.dchip b{display:block;font-size:15px}

.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;text-align:center}
.trust div{font-size:11px;color:var(--ink-2);padding:10px 4px;border-radius:12px;background:var(--surface-2)}
.trust span{display:grid;place-items:center;color:var(--accent);margin-bottom:4px}
.route{display:flex;align-items:center;gap:0;overflow-x:auto;padding:6px 2px 2px;scrollbar-width:none;margin-top:14px}
.route::-webkit-scrollbar{display:none}
.rn{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;min-width:84px;font-size:11.5px;font-weight:600;text-align:center}
.rn i{width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.rl{flex:1;min-width:34px;height:0;border-top:2px dashed var(--accent-line);margin:-20px 0 0}
.rcard{text-align:center;margin-top:34px;color:var(--ink-3);font-size:12.5px}
.marquee{background:linear-gradient(90deg,var(--accent-d),var(--accent));color:#fff;font-weight:600;font-size:13px;padding:9px 0;text-align:center;letter-spacing:.01em}
.marquee b{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:6px;margin:0 4px;letter-spacing:.06em}
.poster{box-shadow:0 22px 44px -24px rgba(120,10,20,.55)}
.poster .rt{display:inline-flex;gap:4px;align-items:center;background:#fff;color:#1B1517;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.poster .rt svg{color:#FFB400}
.poster .off{background:#fff;color:var(--accent);font-weight:800;font-size:11px;padding:3px 9px;border-radius:999px}

.dlist{display:flex;flex-direction:column;gap:4px;margin-top:12px;max-height:260px;overflow-y:auto}
.dsel{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.dhint{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:2px 4px}
.sug{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:14px;color:var(--ink-3)}
.sug:hover,.sug:focus-visible{background:var(--accent-soft)}
.sug.on{background:var(--accent-soft);color:var(--accent)}
.sug .th{width:42px;height:42px;border-radius:12px;overflow:hidden;flex:none;display:block}
.sug .th>*{width:100%;height:100%}.sug .th svg,.sug .th img{width:100%;height:100%;object-fit:cover}
.sug .tx{flex:1;min-width:0;color:var(--ink)}
.sug .tx b{display:block;font-size:14px}.sug .tx small{color:var(--ink-3);font-size:12px}
.sug mark{background:none;color:var(--accent);font-weight:800}
.dnone{padding:18px 8px;text-align:center;color:var(--ink-2);font-size:13px}
.dnone small{color:var(--ink-3)}

/* ===== v4: search panel ===== */
.finder{padding:22px;border-radius:30px;box-shadow:0 30px 70px -30px rgba(90,10,20,.5);border:1px solid rgba(255,255,255,.7)}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.fhead b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.fhead span{font-size:12.5px;color:var(--ink-3)}
.ftabs{display:inline-flex;gap:4px;padding:5px;border-radius:999px;background:var(--surface-2)}
.ftab{display:inline-flex;gap:6px;align-items:center;border:0;background:none;padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink-2);transition:.15s}
.ftab.on{background:var(--accent);color:#fff;box-shadow:0 8px 16px -8px var(--accent)}
.ftab:not(.on):hover{color:var(--accent)}
.finder .big{background:var(--surface-2);border-color:transparent}
.finder .big:focus{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.fchips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
@media (max-width:980px){.fchips{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.fchips{grid-template-columns:1fr}.ftabs{width:100%}.ftab{flex:1;justify-content:center;padding-inline:8px}}
.ftile{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);transition:border .15s,box-shadow .15s,transform .15s}
.ftile:hover{border-color:var(--accent-line);box-shadow:0 14px 26px -18px var(--accent);transform:translateY(-2px)}
.ftile[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.ftile .fi{width:42px;height:42px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ftile.on .fi{background:var(--accent);color:#fff}
.ftile .ft{flex:1;min-width:0}
.ftile small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.ftile b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.ftile.on b{color:var(--accent)}
.ftile .fc{color:var(--ink-3);transition:transform .2s;flex:none}
.ftile[aria-expanded="true"] .fc{transform:rotate(180deg)}
.fchips .pw:nth-child(4) .pop,.fchips .pw:nth-child(3) .pop{left:auto;right:0}
@media (max-width:980px){.fchips .pw:nth-child(odd) .pop{left:0;right:auto}.fchips .pw:nth-child(even) .pop{left:auto;right:0}}
.fpop{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);padding-top:2px}
.fpop .pl{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fpop .pl:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
</style>

function dlistHtml(q){
  q=q.trim().toLowerCase();
  let r=DESTS.filter(d=>!q||d.toLowerCase().includes(q)||PACKAGES.some(p=>p.dest===d&&(p.country.toLowerCase().includes(q)||p.theme.toLowerCase().includes(q))));
  r.sort((a,b)=>(b.toLowerCase().startsWith(q)?1:0)-(a.toLowerCase().startsWith(q)?1:0));
  if(!r.length)return `<div class="dnone">No destination found for “${esc(q)}”.<br><small>Try Goa, Kerala or Dubai.</small></div>`;
  const hl=d=>{const i=q?d.toLowerCase().indexOf(q):-1;return i<0?d:d.slice(0,i)+'<mark>'+d.slice(i,i+q.length)+'</mark>'+d.slice(i+q.length)};
  return (q?'':'<div class="dhint">Popular destinations</div>')+r.map(d=>{const pk=PACKAGES.find(x=>x.dest===d),on=S.dests.includes(d);return `<button class="sug ${on?'on':''}" data-act="dpick" data-v="${d}"><span class="th">${scene(pk.kind)}</span><span class="tx"><b>${hl(d)}</b><small>${pk.country} · ${COUNTS[d]} package${COUNTS[d]>1?'s':''}</small></span>${on?ic('check',18,3):ic('pin',16)}</button>`}).join('')}

  const bud=`<h4>Budget per person</h4><input type="range" id="bud" min="10000" max="${MAXB}" step="2000" value="${S.bud}" aria-label="Maximum budget per person"><div class="rv"><span>₹10,000</span><b id="budv" style="color:var(--accent)">Up to ${fmt(S.bud)}</b></div>`;

  const th=`<h4>Theme</h4><div style="display:flex;gap:8px;flex-wrap:wrap">${THEMES.map(t=>`<button class="chip ${S.theme===t?'on':''}" data-act="theme-cat" data-v="${t}">${t}</button>`).join('')}</div>`;

async function refresh(){S.loading=true;S.error=false;paintBrowse();const key=()=>JSON.stringify([S.q,S.dests,S.dur,S.bud,S.theme,S.sort,S.reg]);const snap=key();

/* ============ Flow logic ============ */
function setIn(path,v){const k=path.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
function initTrav(){const old=S.trav;S.trav=[];for(let i=0;i<S.adults;i++)S.trav.push(old[i]&&old[i].type==='Adult'?old[i]:{type:'Adult',name:'',age:'',gender:'Female'});for(let i=0;i<S.kids;i++)S.trav.push({type:'Child',name:'',age:'',gender:'Female'})}
/* ---------- Validation (shared by typing, blur and submit) ---------- */
const RX={name:/^[A-Za-z][A-Za-z .'-]*$/,city:/^[A-Za-z][A-Za-z .'-]*$/,email:/^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$/,upi:/^[A-Za-z0-9._-]{2,}@[A-Za-z][A-Za-z0-9]{1,}$/};
const luhn=n=>{let sum=0,alt=false;for(let i=n.length-1;i>=0;i--){let d=+n[i];if(alt){d*=2;if(d>9)d-=9}sum+=d;alt=!alt}return sum%10===0};
function vName(v,who){v=(v||'').trim().replace(/\s+/g,' ');if(!v)return 'Enter '+who;if((v.match(/[A-Za-z]/g)||[]).length<3)return 'Enter at least 3 letters';if(!RX.name.test(v))return 'Use letters, spaces and . \' - only';if(v.length>50)return 'Name must be 50 characters or fewer';return ''}
function vMobile(v){const d=(v||'').replace(/\s/g,'');if(!d)return 'Enter your mobile number';if(!/^\d+$/.test(d)||d.length!==10)return 'Enter a valid 10-digit mobile number';if(!/^[6-9]/.test(d))return 'Mobile number must start with 6, 7, 8 or 9';if(/^(\d)\1{9}$/.test(d))return 'Enter a valid mobile number';return ''}
function vEmail(v){v=(v||'').trim();if(!v)return 'Enter your email address';if(v.length>80||!RX.email.test(v)||v.includes('..'))return 'Enter a valid email address';return ''}
function vCity(v){v=(v||'').trim();if(!v)return 'Enter your city';if(v.length<2)return 'City name is too short';if(!RX.city.test(v))return 'Use letters only';if(v.length>40)return 'City name is too long';return ''}
function vAge(v,type){if(!v)return 'Enter age';const a=+v;if(isNaN(a))return 'Age must be a number';if(type==='Adult'){if(a<12)return 'Adults must be 12+';if(a>99)return 'Enter a valid age'}else if(a<2||a>11)return 'Child age 2-11';return ''}
function cardBrand(d){d=(d||'').replace(/\D/g,'');
  if(/^3[47]/.test(d))return{n:'American Express',len:[15],cvv:4,g:[4,6,5]};
  if(/^(3[689]|30[0-5]|3095)/.test(d))return{n:'Diners Club',len:[14],cvv:3,g:[4,6,4]};
  if(/^4/.test(d))return{n:'Visa',len:[13,16],cvv:3,g:[4,4,4,4]};
  if(/^(5[1-5]|222[1-9]|22[3-9]\d|2[3-6]\d\d|27[01]\d|2720)/.test(d))return{n:'Mastercard',len:[16],cvv:3,g:[4,4,4,4]};
  if(/^(60|65|81|82|508|64[4-9])/.test(d))return{n:'RuPay / Discover',len:[16],cvv:3,g:[4,4,4,4]};
  if(/^(50|5[6-9]|6)/.test(d))return{n:'Maestro',len:[12,13,14,15,16,17,18,19],cvv:3,g:[4,4,4,4,4]};
  return null}
function cardFmt(v){let d=(v||'').replace(/\D/g,'');const b=cardBrand(d);d=d.slice(0,b?Math.max(...b.len):19);if(b&&b.g.length<5&&b.n!=='Visa'&&b.n!=='Mastercard'&&b.n!=='RuPay / Discover'){const o=[];let i=0;for(const n of b.g){if(i>=d.length)break;o.push(d.slice(i,i+n));i+=n}return o.join(' ')}return d.replace(/(\d{4})(?=\d)/g,'$1 ')}
function vCard(v){const c=(v||'').replace(/\s/g,'');if(!c)return 'Enter your card number';if(!/^\d+$/.test(c))return 'Card number can only contain digits';const br=cardBrand(c);if(!br)return 'Enter a valid Visa, Mastercard, RuPay or American Express card number';if(!br.len.includes(c.length))return br.n+' card numbers have '+(br.len.length>2?br.len[0]+' to '+br.len[br.len.length-1]:br.len.join(' or '))+' digits';if(!luhn(c))return 'This card number is not valid. Check the digits';return ''}
function vExp(v){if(!v)return 'Enter expiry as MM/YY';if(!/^(0[1-9]|1[0-2])\/\d{2}$/.test(v))return 'Use MM/YY';const mm=+v.slice(0,2),yy=2000+(+v.slice(3)),n=new Date(),cy=n.getFullYear(),cm=n.getMonth()+1;if(yy<cy||(yy===cy&&mm<cm))return 'This card has expired';if(yy>cy+20)return 'Enter a valid expiry year';return ''}
function vCvv(v,card){const br=cardBrand(card),n=br?br.cvv:3;if(!v)return 'Enter CVV';return new RegExp('^\\d{'+n+'}$').test(v)?'':(n===4?'American Express CVV is 4 digits':'CVV is 3 digits')}
function vUpi(v){v=(v||'').trim();if(!v)return 'Enter your UPI ID';return RX.upi.test(v)&&v.length<=60?'':'Enter a valid UPI ID like name@bank'}
function fieldErr(k,v){
  let m;
  if(m=k.match(/^trav\.(\d+)\.(name|age)$/)){const t=S.trav[+m[1]];if(!t)return '';return m[2]==='name'?vName(v,'the full name'):vAge(v,t.type)}
  switch(k){
    case 'contact.mobile':case 'enq.phone':return vMobile(v);
    case 'contact.email':case 'enq.email':return vEmail(v);
    case 'enq.name':return vName(v,'your name');
    case 'enq.city':return vCity(v);
    case 'enq.msg':return (v||'').length>300?'Message must be 300 characters or fewer':'';
    case 'pf.upi':return vUpi(v);
    case 'pf.card':return vCard(v);
    case 'pf.exp':return vExp(v);
    case 'pf.cvv':return vCvv(v,S.pf.card);
  }
  return '';
}
function validTrav(){const e={};S.trav.forEach((t,i)=>{const n=fieldErr('trav.'+i+'.name',t.name);if(n)e['n'+i]=n;const a=fieldErr('trav.'+i+'.age',t.age);if(a)e['a'+i]=a});
  /* Every traveller needs a different name. */
  const seen={};S.trav.forEach((t,i)=>{const k=t.name.trim().replace(/\s+/g,' ').toLowerCase();if(!k||e['n'+i])return;if(seen[k]!==undefined)e['n'+i]='Each traveller needs a different name';else seen[k]=i});
  const m=fieldErr('contact.mobile',S.contact.mobile);if(m)e.mobile=m;const em=fieldErr('contact.email',S.contact.email);if(em)e.email=em;return e}
function validPay(){const e={};if(S.pay==='upi'){const u=fieldErr('pf.upi',S.pf.upi);if(u)e.upi=u}
  if(S.pay==='card'){const c=fieldErr('pf.card',S.pf.card);if(c)e.card=c;const x=fieldErr('pf.exp',S.pf.exp);if(x)e.exp=x;const v=fieldErr('pf.cvv',S.pf.cvv);if(v)e.cvv=v}return e}
function validEnq(){const e={},q=S.enq;const n=fieldErr('enq.name',q.name);if(n)e.name=n;const p=fieldErr('enq.phone',q.phone);if(p)e.phone=p;const m=fieldErr('enq.email',q.email);if(m)e.email=m;const c=fieldErr('enq.city',q.city);if(c)e.city=c;const g=fieldErr('enq.msg',q.msg);if(g)e.msg=g;return e}
/* Show or clear one field's error in place (no re-render, so focus is kept). */
function paintFieldErr(el,msg){const box=el.closest('.field');if(!box)return;const old=box.querySelector('.err-t');if(old)old.remove();el.classList.toggle('err',!!msg);el.setAttribute('aria-invalid',msg?'true':'false');if(msg){const sp=document.createElement('span');sp.className='err-t';sp.setAttribute('role','alert');sp.textContent=msg;box.appendChild(sp)}}

}
function toList(){S.drawer=null;S.view='list';render(true);refresh()}
let ftimer;function startFeat(){clearInterval(ftimer);if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;ftimer=setInterval(()=>{if(S.view==='list'&&!S.drawer){S.feat=(S.feat+1)%FEATURED.length;paintHero()}},6500)}

document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-act]');
  if(!ev.target.closest('.pw')&&S.pop){S.pop=null;paintFilters()}
  if(!t)return;
  const a=t.dataset.act,v=t.dataset.v;
  if(t.classList.contains('dw')&&ev.target!==t)return;
  if(a==='dest'||a==='failToggle')return;
  switch(a){
    case 'theme':{break;const d=document.documentElement,dark=(d.dataset.theme==='dark')||(!d.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);d.dataset.theme=dark?'light':'dark';try{localStorage.setItem('zp-theme2',d.dataset.theme)}catch(e){}render(false);break}
    case 'home':toList();break;
    case 'feat':S.feat=+v;paintHero();startFeat();break;
    case 'pop':S.pop=S.pop===v?null:v;paintFilters();if(S.pop==='dest'){const d=$('#dq');if(d)d.focus({preventScroll:true})}break;
    case 'reg':S.reg=v;refresh();break;
    case 'dpick':{S.dests=S.dests.includes(v)?S.dests.filter(d=>d!==v):[...S.dests,v];paintFilters();const d=$('#dq');if(d){d.focus({preventScroll:true});d.setSelectionRange(d.value.length,d.value.length)}refresh();break}
    case 'popx':S.pop=null;paintFilters();break;
    case 'searchGo':case 'quick':if(v){S.q=v;const q=$('#q');if(q)q.value=v}S.pop=null;refresh();$('#browse')?.scrollIntoView({behavior:'smooth',block:'start'});break;
    case 'story':S.dests=(S.dests.length===1&&S.dests[0]===v)?[]:[v];refresh();$('#browse')?.scrollIntoView({behavior:'smooth',block:'start'});break;
    case 'theme-cat':S.theme=S.theme===v?'':v;S.pop=null;refresh();break;
    case 'dur':S.dur=S.dur===v?'':v;S.pop=null;refresh();break;
    case 'clear':S.q='';S.dests=[];S.dq='';S.reg='';S.dur='';S.bud=MAXB;S.theme='';S.pop=null;const qi=$('#q');if(qi)qi.value='';refresh();break;
    case 'rm':if(v==='q'){S.q='';const q2=$('#q');if(q2)q2.value=''}else if(v.startsWith('d:'))S.dests=S.dests.filter(d=>d!==v.slice(2));else if(v==='theme')S.theme='';else if(v==='dur')S.dur='';else if(v==='bud')S.bud=MAXB;refresh();break;
    case 'retry':refresh();break;
    case 'failOff':demo.fail=false;const cb=document.querySelector('[data-act=failToggle]');if(cb)cb.checked=false;refresh();break;
    case 'save':S.saved[v]=!S.saved[v];if(S.view==='list')paintBrowse();else render(false);toast(S.saved[v]?'Saved to your wishlist':'Removed from wishlist');break;
    case 'open':openPkg(v);break;
    case 'shot':S.shot=+v;render(false);break;
    case 'goto':document.getElementById(v)?.scrollIntoView({behavior:'smooth',block:'start'});break;
    case 'faq':S.openFaq[v]=!S.openFaq[v];render(false);break;
    case 'morerev':S.moreRev=!S.moreRev;render(false);break;
    case 'subscribe':{const em=document.getElementById('nl');if(em&&!vEmail(em.value)){toast('Subscribed! Watch your inbox for deals');em.value=''}else toast(em&&em.value.trim()?'Enter a valid email address':'Enter your email address first');break}
    case 'cpcopy':copy(v);break;
    case 'top':scrollTo({top:0,behavior:'smooth'});break;
    case 'day':S.openDay[v]=!S.openDay[v];render(false);break;
    case 'expand':{const n=pkg().itin.length,all=Object.keys(S.openDay).filter(k=>S.openDay[k]).length===n;S.openDay={};if(!all)for(let i=0;i<n;i++)S.openDay[i]=true;render(false);break}
    case 'date':S.dateIx=+v;render(false);break;
    case 'adm':S.adults=Math.max(1,S.adults-1);render(false);break;case 'adp':S.adults=Math.min(8,S.adults+1);render(false);break;
    case 'chm':S.kids=Math.max(0,S.kids-1);render(false);break;case 'chp':S.kids=Math.min(6,S.kids+1);render(false);break;
    case 'share':{const sp=pkg();openShare(sp.name,'Check out '+sp.name+' on ZPROO Holidays','https://zproo.com/holidays/'+S.id);break}
    case 'shareBooking':{const sp=pkg(),b=S.booking;openShare('My trip to '+sp.dest,'I just booked '+sp.name+' with ZPROO Holidays! Booking ID '+b.id+'.','https://zproo.com/holidays/'+S.id);break}
    case 'shcopy':copy(v);break;
    case 'shclose':if(ev.target.closest('.shc')&&!ev.target.closest('button[data-act="shclose"]'))break;$('#portal').querySelector('.shm')?.remove();break;
    case 'book':initTrav();S.drawer='book';S.step=0;S.errs={};paintDrawer();break;
    case 'enquire':S.drawer='enquire';S.enqErr={};S.enqId='';paintDrawer();break;
    case 'dclose':S.drawer=null;paintDrawer();break;
    case 'dback':S.step=0;S.errs={};paintDrawer();break;
    case 'sendEnq':{S.enqErr=validEnq();if(Object.keys(S.enqErr).length){paintDrawer(true);focusErr();break}S.busy=true;paintDrawer(true);const r=await service.submitEnquiry(S.enq);S.busy=false;S.enqId=r.id;paintDrawer();break}
    case 'to-pay':{S.errs=validTrav();if(Object.keys(S.errs).length){paintDrawer(true);focusErr();break}S.step=1;paintDrawer();break}
    case 'applyCp':{const c=($('#cpn').value||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,20);S.coupon=c;if(COUPONS[c]){S.applied=c;S.cpMsg=`${c} applied. ${COUPONS[c].label}.`}else{S.applied=null;S.cpMsg=c?'That code is not valid. Check it and try again.':'Enter a coupon code first.'}paintDrawer(true);break}
    case 'useCp':S.coupon=v;S.applied=v;S.cpMsg=`${v} applied. ${COUPONS[v].label}.`;paintDrawer(true);break;
    case 'pm':S.pay=v;S.errs={};paintDrawer(true);break;
    case 'pay':{S.errs=validPay();if(Object.keys(S.errs).length){paintDrawer(true);focusErr();break}$('#portal').insertAdjacentHTML('beforeend','<div class="proc" id="proc" role="alert"><div><span class="spin"></span><b>Confirming your payment…</b><span class="muted" style="font-size:12.5px">Please do not close this page</span></div></div>');const r=await service.createBooking({});$('#proc')?.remove();S.booking=r;S.step=2;paintDrawer();break}
    case 'copyId':copy(S.booking.id);break;
    case 'resetPhotos':Object.keys(PHOTOS).forEach(k=>{URL.revokeObjectURL(PHOTOS[k]);delete PHOTOS[k]});render(false);toast('Back to illustrations');break;
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.act==='dest'){const v=t.dataset.v;S.dests=t.checked?[...S.dests,v]:S.dests.filter(d=>d!==v);refresh();return}
  if(t.dataset.act==='failToggle'){demo.fail=t.checked;if(S.view==='list')refresh();else toast(t.checked?'Next package search will fail':'Package search restored');return}
  if(t.id==='photos'){applyPhotos(t.files);t.value='';return}
  if(t.id==='bud'){S.bud=+t.value;refresh();return}
  if(t.id==='sort'){S.sort=t.value;refresh();return}
});
document.addEventListener('keydown',ev=>{if(ev.target.id==='dq'&&ev.key==='Enter'){ev.preventDefault();const f=document.querySelector('#dlist .sug');if(f)f.click()}if(ev.target.id==='dq'&&ev.key==='Escape'){S.pop=null;paintFilters()}});
document.addEventListener('input',ev=>{if(ev.target.id==='dq'){S.dq=ev.target.value;const l=$('#dlist');if(l)l.innerHTML=dlistHtml(S.dq);return}
  const t=ev.target;
  if(t.id==='q'){S.q=t.value;clearTimeout(onQ.t);onQ.t=setTimeout(refresh,350);return}
  if(t.id==='bud'){const b=$('#budv');if(b)b.textContent='Up to '+fmt(+t.value);return}
  if(t.dataset.in){let v=t.value;const k=t.dataset.in;
    if(/(^|\.)name$/.test(k))v=v.replace(/[^A-Za-z .'-]/g,'').replace(/^[^A-Za-z]+/,'').replace(/\s{2,}/g,' ').slice(0,50);
    if(k==='enq.city')v=v.replace(/[^A-Za-z .'-]/g,'').replace(/^[^A-Za-z]+/,'').replace(/\s{2,}/g,' ').slice(0,40);
    if(k==='contact.mobile'||k==='enq.phone'){v=v.replace(/\D/g,'');if(v.length>10)v=v.replace(/^(91|0)/,'');v=v.slice(0,10)}
    if(k==='contact.email'||k==='enq.email')v=v.replace(/\s/g,'').slice(0,80);
    if(k==='pf.upi')v=v.replace(/\s/g,'').slice(0,60);
    if(k==='pf.card'){v=cardFmt(v)}
    if(k==='pf.exp'){v=v.replace(/[^\d/]/g,'').slice(0,5);if(/^\d{2}$/.test(v)&&ev.inputType!=='deleteContentBackward')v+='/'}
    if(k==='pf.cvv'){const bb=cardBrand(S.pf.card);v=v.replace(/\D/g,'').slice(0,bb?bb.cvv:3)}
    if(k==='enq.msg')v=v.slice(0,300);
    if(k.endsWith('.age'))v=v.replace(/\D/g,'').slice(0,2);
    if(v!==t.value)t.value=v;setIn(k,v);
    /* Clear an error as soon as the value becomes valid. */
    if(t.classList.contains('err')&&!fieldErr(k,v))paintFieldErr(t,'')}
});
function onQ(){}
document.addEventListener('focusout',ev=>{const t=ev.target;if(!t||!t.dataset||!t.dataset.in)return;const k=t.dataset.in;
  if(k==='enq.msg'&&!t.value)return;
  /* Wait until the visitor has typed something, so tabbing through an empty form does not flood it with errors. */
  if(!t.value&&!t.classList.contains('err'))return;
  paintFieldErr(t,fieldErr(k,t.value))});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if($('#portal').querySelector('.shm')){$('#portal').querySelector('.shm').remove()}else if(S.drawer){S.drawer=null;paintDrawer()}else if(S.pop){S.pop=null;paintFilters()}}
  if(ev.key==='Enter'&&ev.target.id==='q'){ev.preventDefault();clearTimeout(onQ.t);refresh()}});

render(false);refresh();startFeat();
</script>

</body></html>
